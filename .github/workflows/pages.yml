name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # O site é o próprio sol-3d.html (arquivo único, sem build):
      # index.html para a raiz e o nome original preservado — os dois
      # aceitam query params (?look=sunshine, ?speed=3, ?tier=low)
      - name: Montar site
        run: |
          mkdir -p _site
          cp sol-3d.html _site/index.html
          cp sol-3d.html _site/sol-3d.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
