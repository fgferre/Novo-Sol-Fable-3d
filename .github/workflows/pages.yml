name: GitHub Pages

# Publica via branch gh-pages (auto-habilitada pelo GitHub em repo
# público). A API de "create Pages site" usada pelo actions/deploy-pages
# é admin-only para o GITHUB_TOKEN — por isso o push na branch, não o
# deploy direto por Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # O site é o próprio sol-3d.html (arquivo único, sem build):
      # index.html na raiz + o nome original — os dois aceitam query
      # params (?look=sunshine, ?speed=3, ?tier=low)
      - name: Publicar na branch gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/site
          cp sol-3d.html /tmp/site/index.html
          cp sol-3d.html /tmp/site/sol-3d.html
          touch /tmp/site/.nojekyll
          cd /tmp/site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Pages: sol-3d.html @ ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
