name: GitHub Pages

# Publica via branch gh-pages (auto-habilitada pelo GitHub em repo
# público). A API de "create Pages site" usada pelo actions/deploy-pages
# é admin-only para o GITHUB_TOKEN — por isso o push na branch, não o
# deploy direto por Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # O site é o build Vite (dist/); o build de arquivo único continua
      # publicado como sol-3d.html — baixável e funcional offline/file://,
      # como o original. Os dois aceitam query params (?look=sunshine,
      # ?speed=3, ?tier=low).
      - name: Build
        run: |
          npm ci
          npm run build
          npm run build:single
      - name: Publicar na branch gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/site
          cp -r dist/* /tmp/site/
          cp dist-single/index.html /tmp/site/sol-3d.html
          touch /tmp/site/.nojekyll
          cd /tmp/site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Pages: build Vite @ ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
