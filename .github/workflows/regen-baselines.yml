name: Regenerar baselines

# Caminho OFICIAL para regenerar qa/baselines: roda tools/parity.js no MESMO
# ambiente do gate (ubuntu + SwiftShader + fontes do CI) e publica as capturas
# como artifact para serem commitadas num PR. Regra da série Museu (ver
# docs/SERIE-MUSEU.md): baseline só muda por decisão deliberada, sempre com
# prova cirúrgica de confinamento do diff — nunca regenerar de uma máquina
# local, cujas fontes/ambiente divergem do gate.
on:
  workflow_dispatch:
    inputs:
      # Museu (PR-4): query extra passada ao parity. Vazio = baselines
      # históricas (det puro, knobs pinados em 0). Para a família "museu",
      # passe a query dos knobs ligados usada no passo "Paridade museu" do
      # qa.yml e commite as capturas em qa/baselines-museu/.
      query:
        description: 'Query extra do parity (vazio = baselines históricas)'
        required: false
        default: ''
        type: string

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build (arquivo único)
        run: |
          npm run build
          npm run build:single
      - name: Capturar baselines determinísticas
        run: |
          if [ -n "${{ inputs.query }}" ]; then
            node tools/parity.js qa-out --file dist-single/index.html --query "${{ inputs.query }}"
          else
            node tools/parity.js qa-out --file dist-single/index.html
          fi
      - name: Diff vs baselines atuais (informativo)
        run: |
          BASE_DIR=qa/baselines
          if [ -n "${{ inputs.query }}" ]; then BASE_DIR=qa/baselines-museu; fi
          if [ -d "$BASE_DIR" ]; then
            node tools/imgdiff.js "$BASE_DIR" qa-out --max-frac 1 --out qa-diff --mask 0,0,620,130 --mask 0,-90,9999,90
          else
            echo "sem $BASE_DIR para comparar — primeira geração desta família"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: baselines-regeneradas
          retention-days: 7
          path: |
            qa-out/
            qa-diff/
