<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O Sol — Simulação 3D</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='16' fill='%23ff9a3c'/%3E%3Ccircle cx='32' cy='32' r='24' fill='none' stroke='%23ffb86f' stroke-width='3' stroke-dasharray='3 7'/%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:#000000;
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  #canvas-container{position:fixed; inset:0;}
  #canvas-container canvas{display:block;}
  #ui{
    position:fixed; inset:0; pointer-events:none;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:26px 24px; z-index:10;
  }
  #title-block h1{
    margin:0; font-size:1.05rem; font-weight:600; letter-spacing:0.06em;
    color:#fff2df;
    text-shadow:0 0 18px rgba(255,140,40,0.6), 0 0 3px rgba(0,0,0,0.85);
  }
  #title-block p{
    margin:5px 0 0; font-size:0.7rem; font-weight:400; letter-spacing:0.02em;
    color:#ffd9ad; opacity:0.6;
  }
  #hint{
    align-self:flex-end;
    color:#ffe7c2; font-size:0.66rem; opacity:0.5; letter-spacing:0.01em;
    text-shadow:0 1px 4px rgba(0,0,0,0.8);
    transition:opacity 1.4s ease;
  }
  #loading{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:#000; color:#ffb347; font-size:0.82rem; letter-spacing:0.08em;
    z-index:100; transition:opacity 0.7s ease; text-transform:lowercase;
  }
  #loading.hidden{opacity:0; pointer-events:none;}
</style>
</head>
<body>
  <div id="loading">inicializando simula&ccedil;&atilde;o&hellip;</div>
  <div id="canvas-container"></div>
  <div id="ui">
    <div id="title-block">
      <h1>&#9737; O SOL</h1>
      <p>cromosfera em H-alfa &middot; simula&ccedil;&atilde;o em tempo real</p>
    </div>
    <div id="hint">arraste para girar &middot; scroll para aproximar</div>
  </div>


<script type="module" src="/src/main.js"></script>
</body>
</html>
